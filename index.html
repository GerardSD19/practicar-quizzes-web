<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practicador · Gerard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121214;
  --surface: rgba(24, 24, 27, 0.75);
  --surface2: rgba(45, 45, 52, 0.65);
  --text: #f4f4f5;
  --text-dim: #a1a1aa;
  --border: rgba(255, 255, 255, 0.08);
  --border2: rgba(255, 255, 255, 0.15);
  
  --acc: #fafafa;
  --acc-fg: #09090b;
  --acc-hover: #e4e4e7;
  
  --ok: #34d399;
  --ok-bg: rgba(52, 211, 153, 0.15);
  --err: #f87171;
  --err-bg: rgba(248, 113, 113, 0.15);
  --warn: #fbbf24;
  --warn-bg: rgba(251, 191, 36, 0.15);

  --r: 12px;
  --rs: 8px;
  --tr: .2s ease;
  --sw: 268px;
}

[data-theme="light"] {
  --bg: #fafafa;
  --surface: rgba(255, 255, 255, 0.85);
  --surface2: rgba(244, 244, 245, 0.8);
  --text: #09090b;
  --text-dim: #71717a;
  --border: rgba(0, 0, 0, 0.1);
  --border2: rgba(0, 0, 0, 0.2);
  
  --acc: #18181b;
  --acc-fg: #fafafa;
  --acc-hover: #27272a;
  
  --ok: #16a34a;
  --ok-bg: rgba(22, 163, 74, 0.1);
  --err: #dc2626;
  --err-bg: rgba(220, 38, 38, 0.08);
  --warn: #d97706;
  --warn-bg: rgba(217, 119, 6, 0.1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background-color:var(--bg);background-image:radial-gradient(ellipse at 15% 15%,rgba(255,255,255,.06) 0%,transparent 50%),radial-gradient(ellipse at 85% 85%,rgba(255,255,255,.04) 0%,transparent 60%);background-attachment:fixed;color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;font-size:15px;line-height:1.5;transition:background-color var(--tr), color var(--tr)}
[data-theme="light"] body{background-image:linear-gradient(to bottom right, rgba(255,255,255,0.2), rgba(0,0,0,0.02))}
.screen{display:none}
.screen.active{display:flex;flex-direction:column;min-height:100vh;animation:fu .22s ease}
#screen-home.active,#screen-result.active{display:block}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.ph{border-bottom:1px solid var(--border)}
.phw{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;gap:12px;max-width:1164px;margin:0 auto;width:100%}

.hw{max-width:1100px;margin:0 auto;padding:32px 24px 80px}
.hh{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;gap:16px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:14px}
.li{width:46px;height:46px;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.lt{font-size:1.1rem;font-weight:600;letter-spacing:-.02em}
.ls{font-size:.7rem;color:var(--text-dim);font-weight:500;letter-spacing:.05em;margin-top:1px;text-transform:uppercase}
.ha{display:flex;gap:10px}
.hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}

.cc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;cursor:pointer;transition:var(--tr);position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.cc:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.05)}
.cc:active{transform:translateY(0)}
.cn{font-size:1rem;font-weight:600;margin-bottom:14px;letter-spacing:-.01em}
.cb{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:600;letter-spacing:.05em;padding:4px 10px;border-radius:20px}
.cb .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.sg{background:var(--surface2);color:var(--text-dim);border:1px solid var(--border)}.sg .dot{background:var(--text-dim)}
.sy{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(251, 191, 36, 0.2)}.sy .dot{background:var(--warn)}
.sv{background:var(--ok-bg);color:var(--ok);border:1px solid rgba(52, 211, 153, 0.2)}.sv .dot{background:var(--ok)}
.es{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--text-dim)}
.es .ei{display:block;margin-bottom:14px}

.btn{border:none;cursor:pointer;font-family:'Inter',system-ui,sans-serif;font-weight:500;border-radius:var(--rs);transition:var(--tr);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.8rem;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--acc);color:var(--acc-fg);padding:10px 18px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn-p:hover{background:var(--acc-hover)}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-g{background:transparent;border:1px solid var(--border);color:var(--text);padding:9px 17px}
.btn-g:hover{background:var(--surface2)}
.btn-d{background:var(--err-bg);border:1px solid var(--err-border);color:var(--err);padding:9px 17px}
.btn-d:hover{background:rgba(248,113,113,.25)}
.btn-sm{padding:7px 12px;font-size:.75rem}

.bic{background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:.8rem;transition:var(--tr);display:inline-flex;align-items:center}
.bic:hover{background:var(--surface2);color:var(--text)}
.bic.del{color:var(--err);border-color:var(--err-border)}
.bic.del:hover{background:var(--err-bg)}

/* theme icons */
.theme-toggle{padding:7px 10px}
.theme-toggle .icon-moon{display:none}
[data-theme="light"] .theme-toggle .icon-sun{display:none}
[data-theme="light"] .theme-toggle .icon-moon{display:block}

#screen-quiz.active{display:flex}
.ql{flex:1;display:flex;max-width:1100px;width:100%;margin:0 auto;padding:32px;gap:28px;align-items:flex-start}
.qm{flex:1;min-width:0}
.qs{width:var(--sw);flex-shrink:0;display:flex;flex-direction:column;gap:14px}
.qc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:32px;box-shadow:0 4px 20px rgba(0,0,0,.15);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.pbw{height:4px;background:var(--surface2);border-radius:2px;margin-bottom:22px;overflow:hidden}
.pbf{height:100%;background:var(--text);border-radius:2px;transition:width .4s ease}
.qt{font-size:1.1rem;font-weight:500;line-height:1.6;color:var(--text);margin-bottom:22px;letter-spacing:-.01em}

.qo{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:12px 16px;margin-bottom:8px;cursor:pointer;font-size:.95rem;line-height:1.4;transition:border .15s ease, background .15s ease;display:flex;align-items:center;gap:12px;color:var(--text-dim)}
.qo .ol{min-width:24px;height:24px;width:24px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;color:var(--text-dim);transition:var(--tr);flex-shrink:0}
.qo:hover:not(.disabled){background:var(--surface2);border-color:var(--border2);color:var(--text)}
.qo.selected{background:var(--surface2);border-color:var(--text);color:var(--text)}
.qo.selected .ol{background:var(--text);border-color:var(--text);color:var(--bg)}
.qo.correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.qo.correct .ol{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.qo.incorrect{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.qo.incorrect .ol{background:var(--err);border-color:var(--err);color:#fff}
.qo.disabled{pointer-events:none}

.cdw{height:3px;background:var(--surface2);border-radius:2px;margin-top:12px;overflow:hidden;display:none}
.cdf{height:100%;border-radius:2px;width:100%}
.cdf.ok-bar{background:var(--ok)}
.cdf.fail-bar{background:var(--err)}

.qa{margin-top:22px;display:flex;gap:10px}
.qa .btn{flex:1;padding:12px;font-size:.85rem}

.streak{font-size:.82rem;font-weight:600;color:var(--warn);letter-spacing:.02em;min-height:20px;transition:var(--tr)}

.sg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:12px 8px;text-align:center}
.sn{font-size:1.3rem;font-weight:700;display:block;line-height:1;margin-bottom:4px;letter-spacing:-.02em}
.sl{font-size:.65rem;color:var(--text-dim);font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.npc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.npt{font-size:.7rem;font-weight:600;color:var(--text-dim);letter-spacing:.05em;margin-bottom:12px;text-transform:uppercase}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px;max-height:240px;overflow-y:auto;overflow-x:hidden;padding:8px 8px 4px 4px;margin-right:-8px}

.gi{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:.7rem;color:var(--text-dim);font-weight:600;cursor:pointer;transition:var(--tr);position:relative}
.gi:hover{background:var(--border2);color:var(--text)}
.gi.active{border:1px solid var(--text);color:var(--text);background:var(--surface)}
.gi.done{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}
.gi.fdone{background:var(--err-bg);color:var(--err);border:1px solid var(--err-border)}
.gi.wf::after{content:'!';position:absolute;top:-4px;right:-4px;background:var(--warn);color:#000;font-size:9px;font-weight:800;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:10}

.rw{max-width:480px;margin:0 auto;padding:60px 24px}
.rcrd{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:40px 32px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.15);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.re{font-size:3rem;display:block;margin-bottom:16px}
.rcrd h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:28px}
.rsg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:28px}
.rsc{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:14px 8px}
.rsn{font-size:1.4rem;font-weight:700;display:block;letter-spacing:-.02em;margin-bottom:2px}
.rsl{font-size:.65rem;color:var(--text-dim);font-weight:500;letter-spacing:.05em;text-transform:uppercase}

#screen-editor.active{display:flex}
.el{flex:1;display:flex;max-width:1100px;width:100%;margin:0 auto;padding:32px;gap:28px;align-items:flex-start}
.esb{width:var(--sw);flex-shrink:0}
.em{flex:1;min-width:0}
.pc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ptit{font-size:.7rem;font-weight:600;color:var(--text-dim);letter-spacing:.05em;margin-bottom:14px;text-transform:uppercase}
.inp{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:6px;font-family:'Inter',system-ui,sans-serif;font-size:.85rem;width:100%;margin-bottom:10px;transition:var(--tr)}
.inp:focus{outline:none;border-color:var(--border2);background:var(--surface)}
.inp::placeholder{color:var(--text-dim)}
textarea.inp{resize:vertical;min-height:80px}
.cr{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid transparent;border-radius:6px;margin-bottom:6px;cursor:pointer;transition:var(--tr);font-size:.85rem}
.cr:hover{background:var(--surface2)}
.cr.sel{background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-weight:500}
.qr{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:11px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;transition:var(--tr)}
.qr:hover{border-color:var(--border2)}
.qrt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmc{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;display:none}
.fmc.open{display:block;animation:fu .15s ease}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:8px;margin-bottom:20px}
.tbn{flex:1;padding:8px 12px;border:none;cursor:pointer;border-radius:6px;font-family:'Inter',system-ui,sans-serif;font-size:.75rem;font-weight:500;color:var(--text-dim);background:transparent;transition:var(--tr)}
.tbn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.or{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.or .inp{flex:1;margin:0}
.och{width:16px;height:16px;min-width:16px;accent-color:var(--ok);cursor:pointer}
.uz{border:1px dashed var(--border2);border-radius:6px;padding:24px;text-align:center;color:var(--text-dim);font-size:.8rem;transition:var(--tr);cursor:pointer;margin-bottom:12px;background:var(--surface2)}
.uz:hover{border-color:var(--text-dim);color:var(--text);background:var(--surface)}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

@media(max-width:720px){
  .ql,.el{flex-direction:column;padding:16px 16px 60px;gap:16px}
  .qs,.esb{width:100%}
  .hw{padding:16px 16px 80px}
  .hg{grid-template-columns:1fr}
  .hh{flex-direction:column;align-items:flex-start;gap:14px}
  .ha{width:100%}
  .ha .btn{flex:1}
  .qc{padding:24px 20px}
  .qt{font-size:1rem}
  .phw{padding:16px 20px}
  .sg3{grid-template-columns:1fr 1fr}
  .rw{padding:30px 16px}
}
</style>
<script>!function(){try{var t=localStorage.getItem("DB_QUIZ_THEME")||"dark";document.documentElement.setAttribute("data-theme",t)}catch(e){}}()</script>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login" class="screen">
  <div style="max-width:400px;margin:100px auto;padding:40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);text-align:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)">
    <div style="margin-bottom:24px;font-size:2rem;font-weight:700;letter-spacing:-0.03em">Cloud Sync</div>
    <input type="email" id="log-em" class="inp" placeholder="Correo electrónico" style="margin-bottom:12px">
    <input type="password" id="log-pw" class="inp" placeholder="Contraseña" style="margin-bottom:20px">
    <button id="btn-login" class="btn btn-p" style="width:100%;padding:12px;margin-bottom:12px">Entrar</button>
    <button id="btn-register" class="btn btn-g" style="width:100%;padding:12px">Registrarse</button>
    <div id="log-err" style="color:var(--err);font-size:0.8rem;margin-top:16px;display:none"></div>
  </div>
</div>

<!-- HOME -->
<div id="screen-home" class="screen">
<div class="hw">
  <header class="hh">
    <div class="lg">
      <div class="li"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path></svg></div>
      <div><div class="lt">Practicador de Quizzes</div><div class="ls" id="user-em-txt">Cargando...</div></div>
    </div>
    <div class="ha">
      <button class="btn btn-g btn-sm theme-toggle" title="Cambiar tema">
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button id="btn-manage" class="btn btn-g"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> Gestionar</button>
      <button id="btn-logout" class="btn btn-d btn-sm">Cerrar Sesión</button>
    </div>
  </header>
  <div id="home-list" class="hg"></div>
</div>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen">
<header class="ph">
  <div class="phw">
    <button id="btn-exit" class="btn btn-g btn-sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> Salir</button>
    <div style="display:flex;align-items:center;gap:10px;font-size:.75rem;color:var(--muted);font-weight:600;">
      <span id="hflag" style="color:var(--warn);display:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:text-bottom"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> REVISIÓN</span>
      <span id="qcat">—</span><span style="opacity:.35">·</span><span id="qprog">0/0</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn btn-g btn-sm theme-toggle">
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <span id="streak" class="streak"></span>
    </div>
  </div>
</header>
<div class="ql">
  <div class="qm">
    <div class="qc">
      <div class="pbw"><div class="pbf" id="pbar" style="width:0%"></div></div>

      <div id="qtext" class="qt">...</div>
      <div id="qopts"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
'use strict';

/* ─── FIREBASE ──────────────────────────────────── */
const firebaseConfig = {
  apiKey: "AIzaSyCqCIwinFvtD254el-MfEqPmGWCXhhS2D4",
  authDomain: "tests-3e201.firebaseapp.com",
  projectId: "tests-3e201",
  storageBucket: "tests-3e201.firebasestorage.app",
  messagingSenderId: "73149253046",
  appId: "1:73149253046:web:618f24c509fd0387b8ad17"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const fdb = getFirestore(fbApp);

/* ─── DATA ─────────────────────────────────────── */
const DM = {
  db:{}, sessions:{}, uid:null,
  async loadData(){
    this.db={};
    const snap=await getDocs(collection(fdb,'categories'));
    snap.forEach(d=>{ this.db[d.id]=d.data().questions||[] });
  },
  async loadSessions(){
    this.sessions={};
    if(!this.uid)return;
    const snap=await getDocs(collection(fdb,'users',this.uid,'sessions'));
    snap.forEach(d=>{ this.sessions[d.id]=d.data() });
  },
  async createCat(n){ if(!n||this.db[n])return; this.db[n]=[]; await this.saveCat(n) },
  async renameCat(o,n){
    if(!n||this.db[n])return false;
    this.db[n]=this.db[o]; delete this.db[o];
    const sess=this.sessions[o];
    if(sess){this.sessions[n]=sess;delete this.sessions[o];await setDoc(doc(fdb,'users',this.uid,'sessions',n),sess);await deleteDoc(doc(fdb,'users',this.uid,'sessions',o))}
    await setDoc(doc(fdb,'categories',n),{questions:this.db[n]});
    await deleteDoc(doc(fdb,'categories',o));
    return true
  },
  exportCat(n){ const bl=new Blob([JSON.stringify(this.db[n]||[],null,2)],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(bl); a.download=n+'.txt'; a.click() },
  async deleteCat(n){ if(!confirm('¿Borrar "'+n+'"?'))return; delete this.db[n]; await deleteDoc(doc(fdb,'categories',n)); await this.rmSession(n); Ed.renderCats() },
  async importJSON(t,j){
    try{ const d=JSON.parse(j);
      if(t==='__AUTO__'&&Array.isArray(d)){for(const x of d){if(x.cat){DM.db[x.cat]=x.data;await DM.saveCat(x.cat)}}}
      else if(DM.db[t]){DM.db[t]=DM.db[t].concat(d);await DM.saveCat(t)}
      return true
    }catch(e){alert('Error JSON');return false}
  },
  async saveCat(n){ await setDoc(doc(fdb,'categories',n),{questions:this.db[n]||[]}) },
  async saveSession(n,data){ this.sessions[n]=data; if(!this.uid)return; await setDoc(doc(fdb,'users',this.uid,'sessions',n),data) },
  async rmSession(n){ delete this.sessions[n]; if(!this.uid)return; await deleteDoc(doc(fdb,'users',this.uid,'sessions',n)) },
  nuke(){ if(!confirm('¿Reset total?'))return; location.reload() },
  cats(){ return Object.keys(this.db) }
};

/* ─── QUIZ ENGINE ───────────────────────────────── */
const QE = {
  queue:[], allQ:[], currCat:null, viewingDbIdx:null,
  autoAdv:true, advTimer:null, ADV_OK:4500, ADV_FAIL:4500,
  totalOK:0, totalAtt:0, streak:0, maxStreak:0, failedSet:new Set(),

  start(c){
    if(!DM.db[c]?.length){alert('Categoría vacía');return}
    this.currCat=c;
    const s = DM.sessions[c];
    if(s && s.v===2){this._restoreSession(s);App.showScreen('screen-quiz');this.render();return}
    this._build(c); App.showScreen('screen-quiz'); this.render()
  },

  _build(c){
    this.allQ=DM.db[c].map((q,i)=>({
      t:q.t, opts:q.opts, dbIdx:i,
      sh:q.opts.map((o,k)=>({...o,k})).sort(()=>Math.random()-.5),
      ans:null, sel:[], fails:0
    })).sort(()=>Math.random()-.5);
    this.queue=[...this.allQ];
    this.totalOK=0; this.totalAtt=0; this.streak=0; this.maxStreak=0; this.failedSet=new Set();
  },

  _restoreSession(d){
    this.allQ=d.allQ; this.totalOK=d.ok; this.totalAtt=d.att; this.streak=d.str; this.maxStreak=d.mstr; this.failedSet=new Set(d.fails||[]);
    this.queue=d.qIdx.map(i=>this.allQ.find(q=>q.dbIdx===i)).filter(Boolean);
    if(!this.queue.length){
      if(this.failedSet.size>0){
        const fqs=this.allQ.filter(q=>this.failedSet.has(q.dbIdx));
        this.queue=fqs.map(q=>({...q,sh:q.opts.map((o,k)=>({...o,k})).sort(()=>Math.random()-.5),ans:null,sel:[],fails:0}));
        this.failedSet=new Set(); this.streak=0; this.viewingDbIdx=null;
        this._save();
      }else this._build(this.currCat);
    }
  },

  async _save(){
    if(!this.currCat)return;
    const data = {
      v:2, allQ:this.allQ, qIdx:this.queue.map(q=>q.dbIdx),
      ok:this.totalOK, att:this.totalAtt, str:this.streak, mstr:this.maxStreak, fails:[...this.failedSet]
    };
    await DM.saveSession(this.currCat, data);
  },



  confirm(){
    const q=this.queue[0]; if(!q||q.ans)return;
    const ok=q.sel.length>0&&q.sel.every(i=>q.sh[i].c)&&q.sel.length===q.sh.filter(o=>o.c).length;
    q.ans=ok?'ok':'fail'; this.totalAtt++;
    if(ok){this.totalOK++;this.streak++;if(this.streak>this.maxStreak)this.maxStreak=this.streak}
    else{q.fails++;this.failedSet.add(q.dbIdx);this.streak=0}
    this.render(); this._clearTimer();
    if(this.autoAdv)this._startTimer(ok?this.ADV_OK:this.ADV_FAIL,()=>this.advance(ok))
  },

  advance(wasOK){
    this._clearTimer();
    this.queue.shift(); // remove from queue regardless — wrong ones stay in failedSet
    if(!this.queue.length){this._save();this._showResult();return}
    this._save(); this.render()
  },

  _startTimer(ms,cb){
    const bar=document.getElementById('cdbar');
    const wrap=document.getElementById('cdwrap');
    if(wrap)wrap.style.display='block';
    if(bar){bar.classList.remove('ok-bar','fail-bar');bar.classList.add(ms===this.ADV_OK?'ok-bar':'fail-bar');bar.style.transition='none';bar.style.width='100%';setTimeout(()=>{bar.style.transition=`width ${ms}ms linear`;bar.style.width='0%'},30)}
    this.advTimer=setTimeout(cb,ms)
  },

  _clearTimer(){
    if(this.advTimer){clearTimeout(this.advTimer);this.advTimer=null}
    const wrap=document.getElementById('cdwrap');
    const bar=document.getElementById('cdbar');
    if(wrap)wrap.style.display='none';
    if(bar){bar.style.transition='none';bar.style.width='0'}
  },

  async reset(){
    if(!confirm('¿Reiniciar?'))return;
    await DM.rmSession(this.currCat); this._build(this.currCat); this.render()
  },

  retryFailed(){
    const fqs=this.allQ.filter(q=>this.failedSet.has(q.dbIdx));
    this.queue=fqs.map(q=>({...q,sh:q.opts.map((o,k)=>({...o,k})).sort(()=>Math.random()-.5),ans:null,sel:[],fails:0}));
    this.failedSet=new Set(); this.streak=0; this.viewingDbIdx=null;
    App.showScreen('screen-quiz'); this.render()
  },

  _showResult(){
    const acc=this.totalAtt>0?Math.round(this.totalOK/this.totalAtt*100):100;
    const failed=this.failedSet.size;
    document.getElementById('res-acc').textContent=acc+'%';
    document.getElementById('res-att').textContent=this.totalAtt;
    document.getElementById('res-str').textContent=this.maxStreak;
    document.getElementById('res-emoji').textContent=acc>=90?'🏆':acc>=70?'🎯':'📚';
    document.getElementById('res-title').textContent=acc>=90?'¡Excelente!':acc>=70?'¡Bien hecho!':'¡Sigue practicando!';
    const acts=document.getElementById('res-acts'); acts.innerHTML='';
    const mk=(txt,cls,cb,icon)=>{const b=document.createElement('button');b.className='btn '+cls;b.style.cssText='width:100%;padding:13px;margin-bottom:8px';b.innerHTML=(icon?icon+' ':'')+txt;b.addEventListener('click',cb);acts.appendChild(b)};
    if(failed>0)mk('Repasar falladas ('+failed+')','btn-p',()=>this.retryFailed(),'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>');
    mk('Repetir todo','btn-g',async ()=>{await DM.rmSession(this.currCat);this._build(this.currCat);App.showScreen('screen-quiz');this.render()},'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12a10 10 0 1 0 10-10 10.5 10.5 0 0 0-7 2.6L2 8"/><path d="M2 2v6h6"/></svg>');
    mk('Volver al inicio','btn-g',()=>App.goHome(),'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>');
    App.showScreen('screen-result')
  },

  render(){
    const q=this.viewingDbIdx !== null ? this.allQ.find(x=>x.dbIdx===this.viewingDbIdx) : this.queue[0];
    if(!q){if(this.totalOK>0)this._showResult();return}
    const total=this.allQ.length;
    const done=total-this.queue.length;
    document.getElementById('qcat').textContent=this.currCat;
    document.getElementById('qprog').textContent=done+'/'+total;
    document.getElementById('pbar').style.width=(done/total*100)+'%';
    document.getElementById('streak').innerHTML=this.streak>1?'<span style="display:inline-flex;align-items:center;gap:4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg> '+this.streak+'</span>':'';
    document.getElementById('hflag').style.display=q.fails>0?'inline':'none';
    document.getElementById('qtext').textContent=q.t;
    // options
    const oc=document.getElementById('qopts'); oc.innerHTML='';
    q.sh.forEach((o,i)=>{
      const d=document.createElement('div'); d.className='qo';
      d.innerHTML='<span class="ol">'+String.fromCharCode(65+i)+'</span><span>'+o.t+'</span>';
      if(q.ans){d.classList.add('disabled');if(o.c)d.classList.add('correct');else if(q.sel.includes(i))d.classList.add('incorrect')}
      else if(q.sel.includes(i))d.classList.add('selected');
      d.addEventListener('click',()=>{if(q.ans)return;if(q.sel.includes(i))q.sel=[];else q.sel=[i];this.render()});
      oc.appendChild(d)
    });
    // button
    const btn=document.getElementById('btn-action'); btn.onclick=null;
    if(this.viewingDbIdx !== null) {
      btn.textContent='Volver a la ronda actual →'; btn.className='btn btn-p'; btn.disabled=false;
      btn.onclick=()=>{this.viewingDbIdx=null; this.render()};
    } else if(!q.ans){
      btn.textContent='Confirmar'; btn.className='btn btn-p'; btn.disabled=q.sel.length===0;
      btn.onclick=()=>this.confirm()
    } else if(q.ans==='ok'){
      btn.textContent='Siguiente →'; btn.className='btn btn-g'; btn.disabled=false;
      btn.onclick=()=>this.advance(true)
    } else {
      btn.textContent='Entendido →'; btn.className='btn btn-d'; btn.disabled=false;
      btn.onclick=()=>this.advance(false)
    }
    // stats
    document.getElementById('s-ok').textContent=this.totalOK;
    document.getElementById('s-rem').textContent=this.queue.length;
    document.getElementById('s-fail').textContent=this.failedSet.size;
    // map — click navigation restored
    const grid=document.getElementById('ngrid'); grid.innerHTML='';
    this.allQ.forEach(x=>{
      const d=document.createElement('div'); d.className='gi'; d.textContent=x.dbIdx+1;
      const inQ=this.queue.some(q=>q.dbIdx===x.dbIdx);
      const isCur = this.viewingDbIdx !== null ? (this.viewingDbIdx === x.dbIdx) : (this.queue[0]?.dbIdx === x.dbIdx);
      if(isCur)d.classList.add('active');
      else if(!inQ)d.classList.add(this.failedSet.has(x.dbIdx)?'fdone':'done');
      if(x.fails>0)d.classList.add('wf');
      d.addEventListener('click',()=>{
        const idx=this.queue.findIndex(q=>q.dbIdx===x.dbIdx);
        if(idx>-1){
          const item=this.queue.splice(idx,1)[0];
          this.queue.unshift(item);
          this.viewingDbIdx=null;
        }else{
          this.viewingDbIdx=x.dbIdx;
        }
        this._clearTimer();
        this.render();
      });
      grid.appendChild(d)
    })
  }
};

/* ─── EDITOR ────────────────────────────────────── */
const Ed = {
  selCat:null, editIdx:null,
  createCat(){ const inp=document.getElementById('new-cat'); const n=inp.value.trim(); if(!n)return; DM.createCat(n); inp.value=''; this.renderCats() },
  renderCats(){
    const c=document.getElementById('cat-list'); c.innerHTML='';
    const t=document.getElementById('import-target'); t.innerHTML='<option value="__AUTO__">DETECTAR AUTO</option>';
    DM.cats().forEach(n=>{
      const d=document.createElement('div'); d.className='cr'+(this.selCat===n?' sel':'');
      const sp=document.createElement('span'); sp.textContent=n;
      const bw=document.createElement('div'); bw.style.cssText='display:flex;gap:5px';
      const b_e=document.createElement('button');b_e.className='bic';b_e.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>';b_e.onclick=(e)=>{e.stopPropagation();DM.exportCat(n)};
      const b_r=document.createElement('button');b_r.className='bic';b_r.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>';b_r.onclick=async(e)=>{e.stopPropagation();const nn=prompt('Nuevo:',n);if(nn&&nn!==n&&await DM.renameCat(n,nn)){if(this.selCat===n)this.selCat=nn;this.renderCats()}};
      const b_d=document.createElement('button');b_d.className='bic del';b_d.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';b_d.onclick=(e)=>{e.stopPropagation();DM.deleteCat(n)};
      bw.append(b_e,b_r,b_d); d.append(sp,bw);
      d.addEventListener('click',()=>this.selectCat(n)); c.appendChild(d);
      const o=document.createElement('option'); o.value=n; o.textContent=n; t.appendChild(o)
    })
  },
  rename(o){ const n=prompt('Nuevo nombre:',o); if(n&&n!==o&&DM.renameCat(o,n)){if(this.selCat===o)this.selCat=n;this.renderCats()} },
  selectCat(n){ this.selCat=n; document.getElementById('tgt-cat').textContent=n; this.cancelEdit(); this.renderCats(); this.renderQs() },
  renderQs(){
    const c=document.getElementById('q-list'); c.innerHTML='';
    const s=document.getElementById('search-q').value.toLowerCase();
    if(!this.selCat){c.innerHTML='<div style="color:var(--dim);padding:24px;text-align:center;font-size:.85rem">Selecciona categoría</div>';return}
    const qs=DM.db[this.selCat]||[];
    if(!qs.length){c.innerHTML='<div style="color:var(--dim);padding:24px;text-align:center;font-size:.85rem">Sin preguntas</div>';return}
    qs.forEach((q,i)=>{
      if(s&&!q.t.toLowerCase().includes(s))return;
      const d=document.createElement('div'); d.className='qr';
      const tx=document.createElement('div'); tx.className='qrt'; tx.innerHTML='<b>'+(i+1)+'.</b> '+q.t;
      const bw=document.createElement('div'); bw.style.cssText='display:flex;gap:5px;flex-shrink:0';
      const be=document.createElement('button');be.className='bic';be.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>';be.onclick=()=>this.loadQ(i);
      const bd=document.createElement('button');bd.className='bic del';bd.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';bd.onclick=async()=>{if(!confirm('¿Borrar?'))return;DM.db[this.selCat].splice(i,1);await DM.saveCat(this.selCat);await DM.rmSession(this.selCat);this.renderQs()};
      bw.append(be,bd); d.append(tx,bw); c.appendChild(d)
    })
  },
  switchTab(t){
    document.getElementById('tab-manual').style.display=t==='manual'?'block':'none';
    document.getElementById('tab-bulk').style.display=t==='bulk'?'block':'none';
    document.querySelectorAll('.tbn').forEach(x=>x.classList.remove('active'));
    document.getElementById('tab-'+t+'-btn').classList.add('active');
    if(t==='manual')this.renderCats()
  },
  addOpt(v='',c=false){
    const d=document.createElement('div'); d.className='or';
    const chk=document.createElement('input'); chk.type='checkbox'; chk.className='och'; if(c)chk.checked=true;
    const inp=document.createElement('input'); inp.type='text'; inp.className='inp'; inp.value=v; inp.placeholder='Opción...'; inp.style.margin='0';
    const del=document.createElement('button');del.className='bic del';del.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';del.onclick=()=>d.remove();
    d.append(chk,inp,del); document.getElementById('q-opts-c').appendChild(d)
  },
  openForm(){ if(!this.selCat){alert('Selecciona categoría');return} this.editIdx=null; document.getElementById('q-text').value=''; document.getElementById('q-opts-c').innerHTML=''; this.addOpt();this.addOpt(); document.getElementById('form-card').classList.add('open'); document.getElementById('btn-open-form').style.display='none' },
  loadQ(i){ this.editIdx=i; const q=DM.db[this.selCat][i]; document.getElementById('q-text').value=q.t; document.getElementById('q-opts-c').innerHTML=''; q.opts.forEach(o=>this.addOpt(o.t,o.c)); document.getElementById('form-card').classList.add('open'); document.getElementById('btn-open-form').style.display='none' },
  async saveQ(){
    if(!this.selCat)return;
    const t=document.getElementById('q-text').value.trim(); const opts=[];
    document.querySelectorAll('#q-opts-c .or').forEach(row=>{const tx=row.querySelector('input[type=text]').value.trim();const ck=row.querySelector('input[type=checkbox]').checked;if(tx)opts.push({t:tx,c:ck})});
    if(!t||opts.length<2){alert('Necesitas enunciado y ≥2 opciones');return}
    const q={t,opts};
    if(this.editIdx!==null)DM.db[this.selCat][this.editIdx]=q; else DM.db[this.selCat].push(q);
    await DM.saveCat(this.selCat); await DM.rmSession(this.selCat);
    this.cancelEdit(); this.renderQs()
  },
  cancelEdit(){ this.editIdx=null; document.getElementById('form-card').classList.remove('open'); document.getElementById('btn-open-form').style.display='' }
};

/* helper */
function b(str,cls,cb){ const el=document.createElement('button'); el.className=cls; el.innerHTML=str; el.addEventListener('click',cb); return el }

/* ─── APP ───────────────────────────────────────── */
const App = { init(){
    document.getElementById('btn-manage').addEventListener('click',()=>{App.showScreen('screen-editor');Ed.switchTab('manual')});
    document.getElementById('btn-exit').addEventListener('click',()=>App.goHome());
    document.getElementById('btn-reset').addEventListener('click',()=>QE.reset());
    document.getElementById('btn-back').addEventListener('click',()=>App.goHome());
    document.getElementById('btn-add-cat').addEventListener('click',()=>Ed.createCat());
    document.getElementById('new-cat').addEventListener('keydown',e=>{if(e.key==='Enter')Ed.createCat()});
    document.querySelectorAll('.tbn').forEach(btn=>btn.addEventListener('click',()=>Ed.switchTab(btn.dataset.tab)));
    document.getElementById('btn-add-opt').addEventListener('click',()=>Ed.addOpt());
    document.getElementById('btn-save-q').addEventListener('click',()=>Ed.saveQ());
    document.getElementById('btn-cancel').addEventListener('click',()=>Ed.cancelEdit());
    document.getElementById('btn-open-form').addEventListener('click',()=>Ed.openForm());
    document.getElementById('search-q').addEventListener('input',()=>Ed.renderQs());
    document.getElementById('import-target').addEventListener('change',()=>{const v=document.getElementById('import-target').value;document.getElementById('bulk-in').placeholder=v==='__AUTO__'?'JSON completo [{cat,data}...]':'Array preguntas [...]'});
    document.getElementById('uzn').addEventListener('click',()=>document.getElementById('file-up').click());
    document.getElementById('file-up').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>document.getElementById('bulk-in').value=ev.target.result;r.readAsText(f)});
    document.getElementById('btn-import').addEventListener('click',async()=>{const t=document.getElementById('import-target').value;const v=document.getElementById('bulk-in').value.trim();if(v&&await DM.importJSON(t,v)){alert('Importado');Ed.renderCats()}});
    // keyboard
    document.addEventListener('keydown',e=>{
      if(e.target.matches('input,textarea,select'))return;
      const q=QE.queue[0]; if(!q)return;
      const num=parseInt(e.key);
      if(num>=1&&num<=9&&!q.ans){const i=num-1;if(i<q.sh.length){const x=q.sel.indexOf(i);if(x>-1)q.sel.splice(x,1);else q.sel.push(i);QE.render()}}
      if((e.key==='Enter'||e.key===' ')&&!document.getElementById('btn-action').disabled){e.preventDefault();document.getElementById('btn-action').click()}
    });
    // auth
    document.getElementById('btn-login').addEventListener('click',async()=>{
      const em=document.getElementById('log-em').value.trim();
      const pw=document.getElementById('log-pw').value;
      const errEl=document.getElementById('log-err');
      errEl.style.display='none';
      try{ await signInWithEmailAndPassword(auth,em,pw) }
      catch(e){ errEl.textContent=e.message; errEl.style.display='block' }
    });
    document.getElementById('btn-register').addEventListener('click',async()=>{
      const em=document.getElementById('log-em').value.trim();
      const pw=document.getElementById('log-pw').value;
      const errEl=document.getElementById('log-err');
      errEl.style.display='none';
      try{ await createUserWithEmailAndPassword(auth,em,pw) }
      catch(e){ errEl.textContent=e.message; errEl.style.display='block' }
    });
    document.getElementById('btn-logout').addEventListener('click',async()=>{
      await signOut(auth); DM.db={}; DM.sessions={}; DM.uid=null;
    });
    App.showScreen('screen-login');
    onAuthStateChanged(auth,async user=>{
      if(user){
        DM.uid=user.uid;
        document.getElementById('user-em-txt').textContent=user.email;
        const isAdmin=user.uid==='Mxji9YlIvcRfG0keCoEGbU1ZhMb2';
        document.getElementById('btn-manage').style.display=isAdmin?'':'none';
        await DM.loadData();
        await DM.loadSessions();
        App.goHome();
      } else {
        App.showScreen('screen-login');
      }
    });
  },
  goHome(){
    this.showScreen('screen-home');
    const c=document.getElementById('home-list'); c.innerHTML='';
    const cats=DM.cats();
    if(!cats.length){c.innerHTML='<div class="es"><span class="ei"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--dim);margin-bottom:12px"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></span><br>Sin categorías.<br>Pulsa <b>Gestionar</b> para añadir preguntas.</div>';return}
    cats.forEach(n=>{
      const d=DM.sessions[n];
      let cl='sg',tx='Sin empezar';
      if(d&&d.v===2&&d.qIdx){if(d.qIdx.length===0){if(d.fails&&d.fails.length>0){cl='sy';tx='Repaso pte. ('+d.fails.length+')'}else{cl='sv';tx='Completado'}}else if(d.ok>0||d.att>0){cl='sy';tx='En proceso ('+d.qIdx.length+' rest.)'}}
      const div=document.createElement('div'); div.className='cc';
      div.innerHTML='<div class="cn">'+n+'</div><div class="cb '+cl+'"><span class="dot"></span>'+tx+'</div>';
      div.addEventListener('click',()=>QE.start(n)); c.appendChild(div)
    })
  },
  showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active') }
};

App.init();
</script>
</body>
</html>
