<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRACTICAR QUIZZES // GERARD + TXT UPLOAD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e2024 0%, #23252b 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            --glass-blur: blur(12px);
            --text-main: #e0e0e0;
            --text-muted: #9ca3af;
            --text-highlight: #ffffff;
            --accent-primary: #6c5ce7; 
            --accent-success: #00b894;
            --accent-danger: #ff7675;
            --accent-warning: #fdcb6e;
            --radius-lg: 24px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
        }

        h1, h2, h3, h4 { color: var(--text-highlight); margin: 0 0 15px 0; font-weight: 700; letter-spacing: -0.5px; }

        /* --- SCREEN & PANEL --- */
        .screen { display: none; height: 100%; flex-direction: column; }
        .screen.active { display: flex; animation: fadeScale 0.3s ease-out; }
        @keyframes fadeScale { from { opacity: 0; transform: scale(0.99); } to { opacity: 1; transform: scale(1); } }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; padding: 0 10px;
            max-width: 1200px; width: 100%; margin-left: auto; margin-right: auto;
        }
        .app-title { font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; color: var(--text-highlight); }

        /* --- CONTROLS --- */
        input, textarea, select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--text-highlight);
            padding: 14px 18px;
            width: 100%;
            font-family: 'Montserrat', sans-serif; 
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent-primary); background: rgba(0, 0, 0, 0.4); }

        .btn {
            border: none; padding: 12px 24px; cursor: pointer;
            border-radius: var(--radius-md);
            font-family: 'Montserrat', sans-serif; 
            font-weight: 600; font-size: 0.85rem;
            transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            text-transform: uppercase;
        }
        .btn:hover { transform: scale(1.05); z-index: 5; } 
        .btn:active { transform: scale(0.95); }

        .btn-default { background: rgba(255,255,255,0.1); color: var(--text-highlight); }
        .btn-primary { background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%); color: white; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3); }
        .btn-danger { background: rgba(255, 118, 117, 0.1); color: var(--accent-danger); border: 1px solid rgba(255, 118, 117, 0.3); }
        
        .btn-icon {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted); border-radius: 8px; padding: 6px 12px;
            font-family: 'Montserrat', sans-serif; font-size: 0.75rem; font-weight: 700;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.2); color: white; transform: scale(1.1); }
        .btn-icon.del:hover { background: var(--accent-danger); border-color: var(--accent-danger); }
        .btn-icon.edit:hover { background: var(--accent-warning); border-color: var(--accent-warning); color: #000; }

        .filter-toggle {
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 10px 20px; cursor: pointer;
            font-family: 'Montserrat', sans-serif; font-size: 0.8rem; font-weight: 700;
            color: var(--text-muted); transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .filter-toggle.active {
            background: var(--accent-warning); color: #1e2024; border-color: var(--accent-warning);
            box-shadow: 0 0 15px rgba(253, 203, 110, 0.4);
        }

        /* --- HOME GRID --- */
        .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; width: 100%; padding: 40px; }
        .cat-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            border-radius: var(--radius-md); padding: 25px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; flex-direction: column; justify-content: space-between;
            min-height: 120px; position: relative; overflow: hidden;
        }
        .cat-card:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.3); transform: scale(1.03); z-index: 10; }
        .cat-name { font-weight: 700; font-size: 1.1rem; color: var(--text-highlight); margin-bottom: 10px; z-index: 2; }
        .cat-status-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 600; padding: 6px 12px; border-radius: 20px; background: rgba(0,0,0,0.3); width: fit-content; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .st-grey .status-dot { background: #636e72; } .st-grey { color: var(--text-muted); border: 1px solid #636e72; }
        .st-yellow .status-dot { background: var(--accent-warning); } .st-yellow { color: var(--accent-warning); border: 1px solid var(--accent-warning); }
        .st-green .status-dot { background: var(--accent-success); } .st-green { color: var(--accent-success); border: 1px solid var(--accent-success); }

        /* --- QUIZ UI --- */
        .quiz-layout { display: grid; grid-template-columns: 1fr 420px; gap: 20px; height: 100%; overflow: hidden; max-width: 1200px; margin: 0 auto; width: 100%; }
        
        .quiz-option {
            background: rgba(255,255,255,0.03); border: 1px solid transparent; border-radius: var(--radius-md);
            padding: 18px 22px; margin: 0 5px 12px 5px; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); font-size: 1rem;
            display: flex; align-items: center; white-space: normal; word-wrap: break-word; line-height: 1.5;
        }
        .quiz-option:hover:not(.disabled) { background: rgba(255,255,255,0.08); transform: scale(1.015); border-color: rgba(255,255,255,0.3); }
        .quiz-option.selected { background: rgba(108, 92, 231, 0.15); border-color: var(--accent-primary); color: white; font-weight: 600; transform: scale(1.015); }
        .quiz-option.correct { background: rgba(0, 184, 148, 0.15); border-color: var(--accent-success); color: #55efc4; }
        .quiz-option.incorrect { background: rgba(255, 118, 117, 0.15); border-color: var(--accent-danger); color: #ff7675; }
        .quiz-option.disabled { cursor: default; opacity: 0.9; transform: none !important; }
        .question-text { font-size: 1.3rem; font-weight: 600; line-height: 1.6; color: white; margin-bottom: 30px; white-space: normal; padding-right: 10px; }
        
        .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-box {
            background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border); border-radius: var(--radius-md);
            padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: center;
        }
        .stat-num { font-size: 1.8rem; font-weight: 800; display: block; margin-bottom: 5px; }
        .stat-lbl { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; letter-spacing: 1px; }

        .nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(35px, 1fr)); gap: 8px; overflow-y: auto; max-height: 400px; padding: 10px; }
        .grid-item { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .grid-item.active { background: white; color: black; transform: scale(1.15); z-index: 2; }
        .grid-item.correct { background: var(--accent-success); color: black; }
        .grid-item.incorrect { background: var(--accent-danger); color: white; }
        .grid-item.was-failed { border-color: var(--accent-warning); position: relative; }
        .grid-item.was-failed::after {
            content: '!'; position: absolute; top: -5px; right: -5px; background: var(--accent-warning); color: black;
            font-size: 9px; font-weight: bold; width: 14px; height: 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        .grid-item.skipped {
            background: #151515;
            color: #444;      
            border: 1px solid #222;
            cursor: not-allowed;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }
        .grid-item.skipped:hover { transform: none; background: #151515; }

        /* --- EDITOR UI --- */
        .editor-layout { display: grid; grid-template-columns: 450px 1fr; gap: 25px; height: 100%; overflow: hidden; max-width: 1200px; margin: 0 auto; width: 100%; }
        .editor-tabs { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
        .tab-link { 
            background: transparent; border: none; color: var(--text-muted); padding: 8px 16px; 
            cursor: pointer; font-weight: 700; border-radius: 20px; transition: 0.2s;
            font-family: 'Montserrat', sans-serif; font-size: 0.9rem;
        }
        .tab-link:hover { background: rgba(255,255,255,0.05); transform: scale(1.05); }
        .tab-link.active { background: rgba(255,255,255,0.15); color: white; transform: scale(1.05); }

        .cat-list-panel { 
            flex: 1; min-height: 0;
            overflow-y: auto; padding-right: 5px; padding-top: 10px; padding-bottom: 20px; display: flex; flex-direction: column; gap: 8px; 
        }
        
        .cat-item-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; background: rgba(255,255,255,0.03); border-radius: var(--radius-sm);
            cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            border: 1px solid transparent; margin: 0 5px; 
        }
        .cat-item-row:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); transform: scale(1.02); z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .cat-item-row.active { background: rgba(108, 92, 231, 0.2); border-color: var(--accent-primary); color: white; transform: scale(1.02); z-index: 4; }

        .editor-main-col { display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        .q-list-panel { flex: 1; overflow-y: auto; padding: 5px; min-height: 0; }
        
        .q-row {
            background: rgba(255,255,255,0.02); padding: 15px; border-radius: var(--radius-sm); margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;
            border: 1px solid transparent; transition: all 0.2s; margin: 0 5px 8px 5px;
        }
        .q-row:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); transform: scale(1.01); z-index: 5; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .q-text-full { flex: 1; margin-right: 20px; white-space: normal; word-wrap: break-word; line-height: 1.4; color: var(--text-main); }

        .new-btn-container { padding: 10px; margin-bottom: 10px; display: flex; justify-content: center; }
        #btn-toggle-form { width: 94%; border: 1px dashed var(--glass-border); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

        @media(max-width: 850px) { 
            .quiz-layout { grid-template-columns: 1fr; overflow-y: auto; display: block; } 
            .editor-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .cat-list-panel { max-height: 200px; margin-bottom: 20px; border: 1px solid var(--glass-border); padding: 10px; border-radius: var(--radius-md); }
        }
    </style>
</head>
<body>

    <div id="screen-home" class="screen active">
        <div class="top-bar">
            <div class="app-title">PRACTICAR QUIZZES <span style="font-weight:300; opacity:0.6; font-size:0.8em;">Gerard</span></div>
        </div>

        <div class="panel" style="max-width: 1200px; margin: 0 auto; width: 100%; height: 100%; padding: 40px;">
            <div style="flex: 1; overflow-y: auto;">
                <h2 style="text-align: center; margin-bottom: 40px; font-weight: 300; font-size: 2rem;">
                    Selecciona una <strong style="font-weight:700; color:var(--accent-primary);">Categoría</strong>
                </h2>
                <div id="home-cat-list" class="cat-grid"></div>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 20px; justify-content: center;">
                <button class="btn btn-default" style="min-width: 200px;" onclick="App.showEditor()">GESTIONAR CATEGORÍAS</button>
                <button class="btn btn-danger" onclick="DataManager.nuke()">RESET FÁBRICA</button>
            </div>
        </div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="top-bar">
            <div style="display:flex; align-items:center; gap:15px; flex:1;">
                <button class="btn btn-default" style="padding: 8px 16px; font-size: 0.75rem;" onclick="App.goHome()">SALIR AL MENÚ</button>
                <div class="app-title" id="quiz-cat-name" style="margin:0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">...</div>
            </div>
            <button id="btn-filter-img" class="filter-toggle" onclick="QuizEngine.toggleImgFilter()">
                <span>👁️</span> TODO
            </button>
        </div>

        <div class="quiz-layout">
            <div class="panel" style="padding: 30px;">
                <div style="flex: 1; overflow-y: auto; padding-right: 15px; padding-left: 5px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 20px; color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">
                        <span id="quiz-progress">PREGUNTA 1 / X</span>
                        <span id="quiz-history-flag" style="color: var(--accent-warning); display: none;">⚠ REVISIÓN</span>
                    </div>
                    <div id="quiz-img-warn" style="display:none; padding:15px; border-radius:var(--radius-md); border:1px dashed var(--accent-primary); color:var(--accent-primary); background: rgba(108, 92, 231, 0.05); margin-bottom: 25px;">
                        <strong>📷 Imagen Requerida:</strong> Consultar documento PDF.
                    </div>
                    <div id="quiz-question" class="question-text">...</div>
                    <div id="quiz-options"></div>
                </div>
                <div style="padding-top: 25px; margin-top: 10px; border-top: 1px solid var(--glass-border);">
                    <button id="btn-action" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1rem;">CONFIRMAR RESPUESTA</button>
                </div>
            </div>
            <div class="panel" style="padding: 25px;">
                <h4 style="color: var(--text-muted); text-transform: uppercase; font-size: 0.85rem;">Estadísticas</h4>
                <div class="stats-row">
                    <div class="stat-box" style="border-color: rgba(0, 184, 148, 0.3);">
                        <span id="stat-ok" class="stat-num" style="color: var(--accent-success);">0</span>
                        <span class="stat-lbl">Aciertos</span>
                    </div>
                    <div class="stat-box" style="border-color: rgba(255, 118, 117, 0.3);">
                        <span id="stat-fail" class="stat-num" style="color: var(--accent-danger);">0</span>
                        <span class="stat-lbl">Fallos</span>
                    </div>
                </div>
                <h4 style="color: var(--text-muted); text-transform: uppercase; font-size: 0.85rem; margin-top: 10px;">Navegación</h4>
                <div id="nav-grid" class="nav-grid"></div>
                <div style="margin-top: auto;">
                    <button class="btn btn-danger" style="width: 100%; font-size: 0.8rem;" onclick="QuizEngine.resetProgress()">REINICIAR TODO</button>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-editor" class="screen">
        <div class="top-bar">
            <div class="app-title">GESTOR DE DATOS</div>
            <button class="btn btn-default" onclick="App.goHome()">VOLVER</button>
        </div>

        <div class="panel" style="flex: 1; padding: 30px; max-width: 1200px; margin: 0 auto; width: 100%;">
            <div class="editor-tabs">
                <button id="tab-manual-btn" class="tab-link active" onclick="Editor.switchTab('manual')">EDICIÓN MANUAL</button>
                <button id="tab-bulk-btn" class="tab-link" onclick="Editor.switchTab('bulk')">IMPORTAR JSON</button>
            </div>

            <div id="tab-manual" class="editor-layout">
                <div style="display: flex; flex-direction: column; overflow: hidden;">
                    <div style="margin-bottom: 15px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: var(--radius-sm); border: 1px solid var(--glass-border);">
                        <h4 style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 10px;">AÑADIR CATEGORÍA</h4>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="new-cat-input" placeholder="Nombre..." style="margin-bottom: 0;">
                            <button class="btn btn-primary" style="padding: 0 15px;" onclick="Editor.createCategory()">+</button>
                        </div>
                    </div>
                    <div style="padding-bottom: 10px; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; font-weight: 700;">Listado</div>
                    <div id="editor-cat-list" class="cat-list-panel"></div>
                </div>

                <div class="editor-main-col">
                    <div class="new-btn-container">
                        <button id="btn-toggle-form" class="btn btn-default" onclick="Editor.openNew()">+ NUEVA PREGUNTA</button>
                    </div>

                    <div id="form-container" style="background: rgba(255,255,255,0.02); padding: 25px; border-radius: var(--radius-md); margin-bottom: 25px; border: 1px solid var(--glass-border); flex-shrink: 0; display:none;">
                        <div style="display:flex; justify-content: space-between; margin-bottom: 15px;">
                            <span id="form-title" style="font-weight: 700; color: var(--text-muted);">NUEVA PREGUNTA</span>
                            <span id="target-cat" style="color: var(--accent-primary); font-weight: 700;"></span>
                        </div>
                        <textarea id="q-text" rows="2" placeholder="Escribe el enunciado..."></textarea>
                        <div id="q-options-container"></div>
                        <div style="display:flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                            <button class="btn btn-default" style="font-size: 0.8rem;" onclick="Editor.addOptionInput()">+ OPCIÓN</button>
                            <label style="display:flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-muted);">
                                <input type="checkbox" id="q-img-check" style="width: auto; margin: 0;"> Requiere Imagen
                            </label>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr auto; gap: 15px; margin-top: 20px;">
                            <button id="btn-save-q" class="btn btn-primary" onclick="Editor.saveQuestion()">GUARDAR</button>
                            <button class="btn btn-danger" onclick="Editor.cancelEdit()">CANCELAR</button>
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
                        <input type="text" id="search-q" placeholder="Filtrar preguntas..." oninput="Editor.renderQuestionsList()" style="margin-bottom: 10px;">
                        <div id="editor-q-list" class="q-list-panel"></div>
                    </div>
                </div>
            </div>

            <div id="tab-bulk" style="display:none; height: 100%; overflow-y: auto;">
                <div style="max-width: 800px; margin: 0 auto; padding-top: 20px;">
                    <h3 style="color: var(--text-highlight); margin-bottom: 20px;">Importación / Restauración</h3>
                    <label style="display: block; margin-bottom: 10px; font-weight: 600; color: var(--text-muted);">DESTINO:</label>
                    <select id="import-target" onchange="Editor.updateBulkPlaceholder()"></select>
                    
                    <div style="margin-bottom: 15px; padding: 10px; border: 1px dashed var(--glass-border); border-radius: var(--radius-sm);">
                        <label style="display: block; margin-bottom: 5px; font-size: 0.8rem; color: var(--text-muted);">O sube un archivo (.txt):</label>
                        <input type="file" id="file-input" accept=".txt, .json" onchange="Editor.readFile(this)" style="padding: 5px;">
                    </div>
                    <textarea id="bulk-input" style="height: 400px; font-family: 'Montserrat', monospace; font-size: 0.85rem; color: #a29bfe; line-height: 1.5;" placeholder="[...]"></textarea>
                    <button class="btn btn-primary" style="width: 100%; margin-top: 25px;" onclick="Editor.processBulk()">PROCESAR JSON</button>
                </div>
            </div>
        </div>
    </div>

<script>
const DataManager = {
    key: 'DB_QUIZ_V29', 
    db: {},
    init() {
        const raw = localStorage.getItem(this.key);
        if(raw) { try { this.db = JSON.parse(raw); } catch(e) { this.db = {}; } }
        else {
            const oldKeys = ['DB_QUIZ_V28', 'DB_QUIZ_V27', 'DB_QUIZ_V26'];
            for(let k of oldKeys) {
                const old = localStorage.getItem(k);
                if(old) { try{ this.db=JSON.parse(old); this.save(); break; }catch(e){} }
            }
        }
    },
    save() { localStorage.setItem(this.key, JSON.stringify(this.db)); },
    createCat(n) { if(!n || this.db[n]) return false; this.db[n] = []; this.save(); return true; },
    renameCat(o, n) { 
        if(!n || this.db[n]) return false; 
        this.db[n] = this.db[o]; delete this.db[o]; 
        const s = localStorage.getItem('SESSION_'+o); if(s) { localStorage.setItem('SESSION_'+n, s); localStorage.removeItem('SESSION_'+o); }
        this.save(); return true; 
    },
    deleteCat(n) { if(confirm("¿Eliminar?")) { delete this.db[n]; localStorage.removeItem('SESSION_'+n); this.save(); return true; } return false; },
    exportCategory(n) {
        const b = new Blob([JSON.stringify(this.db[n]||[], null, 2)], {type:"text/plain"});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = n+"_backup.txt"; a.click();
    },
    addQ(cat, q) { if(!this.db[cat]) return; this.db[cat].push(q); this.save(); QuizEngine.syncAdd(cat, q, this.db[cat].length-1); },
    updateQ(cat, i, q) { if(!this.db[cat]) return; this.db[cat][i] = q; this.save(); QuizEngine.syncUpdate(cat, i, q); },
    deleteQ(cat, i) { if(!this.db[cat]) return; this.db[cat].splice(i, 1); this.save(); QuizEngine.syncRemove(cat, i); },
    importJSON(t, j) {
        try {
            const d = JSON.parse(j);
            if(t === '__AUTO__') {
                if(Array.isArray(d) && d[0].cat) d.forEach(x => { if(x.cat && x.data) this.db[x.cat] = x.data; });
                else Object.keys(d).forEach(k => this.db[k] = d[k]);
            } else {
                if(!Array.isArray(d)) throw new Error("Array requerido");
                if(!this.db[t]) this.db[t] = [];
                const start = this.db[t].length;
                this.db[t] = this.db[t].concat(d);
                d.forEach((q, i) => QuizEngine.syncAdd(t, q, start+i));
            }
            this.save(); return true;
        } catch(e) { alert("Error JSON: " + e.message); return false; }
    },
    nuke() { if(confirm("¿RESET?")) { localStorage.clear(); location.reload(); } },
    getCats() { return Object.keys(this.db); }
};

const QuizEngine = {
    activeQ: [], currIdx: 0, currCat: null, isFiltered: false,
    start(c) {
        const raw = DataManager.db[c];
        if (!raw || raw.length === 0) { alert("NO HAY PREGUNTAS EN ESTA CATEGORÍA"); return; }
        
        this.currCat = c;
        const s = localStorage.getItem('SESSION_'+c);
        if(s) { 
            try { 
                const d = JSON.parse(s); 
                this.activeQ = d.q; 
                this.currIdx = d.idx; 
                this.isFiltered = d.isFiltered || false; 
                this.applyFilter(); 
                if(!this.activeQ.length) throw "e"; 
            } catch(e) { this.initSession(c); } 
        } else {
            this.initSession(c);
        }
        App.showScreen('screen-quiz'); this.render();
    },
    initSession(c) {
        const r = DataManager.db[c];
        this.activeQ = r.map((q, i) => ({
            ...q, 
            dbIdx: i, 
            shuffledOpts: q.opts.map((o, k) => ({...o, oid: k})).sort(()=>Math.random()-0.5), 
            status: 'pending', 
            userSel: [], 
            flagged: false,
            skipped: false
        })).sort(()=>Math.random()-0.5);

        this.currIdx = 0; 
        this.isFiltered = false; 
        this.applyFilter();
        this.save();
    },
    
    // --- LÓGICA FILTRO GHOST ---
    applyFilter() {
        this.activeQ.forEach(q => {
            if (this.isFiltered && q.img) q.skipped = true;
            else q.skipped = false;
        });
        if(this.activeQ[this.currIdx] && this.activeQ[this.currIdx].skipped) {
            this.goToNextAvailable();
        }
    },
    toggleImgFilter() {
        this.isFiltered = !this.isFiltered;
        this.applyFilter();
        this.save();
        this.render();
    },
    goToNextAvailable() {
        let found = false;
        for(let i = 0; i < this.activeQ.length; i++) {
            if(!this.activeQ[i].skipped) {
                this.currIdx = i;
                found = true;
                break;
            }
        }
        if(!found) alert("Filtro bloquea todo");
    },
    // ---------------------------

    save() { if(this.currCat) localStorage.setItem('SESSION_'+this.currCat, JSON.stringify({q: this.activeQ, idx: this.currIdx, isFiltered: this.isFiltered})); },
    syncAdd(c, q, i) { 
        const k='SESSION_'+c, s=localStorage.getItem(k); if(!s) return; 
        const d=JSON.parse(s); d.q.push({...q, dbIdx: i, shuffledOpts: q.opts.map((o, x)=>({...o, oid: x})).sort(()=>Math.random()-0.5), status: 'pending', userSel: [], flagged: false, skipped: false}); localStorage.setItem(k, JSON.stringify(d)); 
    },
    syncUpdate(c, i, q) {
        const k='SESSION_'+c, s=localStorage.getItem(k); if(!s) return;
        const d=JSON.parse(s);
        const h = d.q.find(x => x.dbIdx === i); 
        if(h) { 
            const estabaAcabada = d.idx >= d.q.length - 1;
            h.t=q.t; h.img=q.img; h.opts=q.opts; 
            h.shuffledOpts=q.opts.map((o, x)=>({...o, oid: x})).sort(()=>Math.random()-0.5); 
            h.status='pending'; h.userSel=[]; h.flagged = false; 
            h.skipped = d.isFiltered && h.img; // Update ghost status

            if(estabaAcabada) {
                d.idx = d.q.indexOf(h);
                if(d.idx >= d.q.length - 1 && d.q.length > 1) { d.idx = d.idx - 1; }
            }
            localStorage.setItem(k, JSON.stringify(d)); 
        }
    },
    syncRemove(c, i) {
        const k='SESSION_'+c, s=localStorage.getItem(k); if(!s) return;
        const d=JSON.parse(s); d.q=d.q.filter(x=>x.dbIdx!==i); d.q.forEach(x=>{if(x.dbIdx>i)x.dbIdx--}); if(d.idx>=d.q.length) d.idx=Math.max(0, d.q.length-1); localStorage.setItem(k, JSON.stringify(d));
    },
    resetProgress() { if(confirm("¿Reiniciar?")) { localStorage.removeItem('SESSION_'+this.currCat); this.initSession(this.currCat); this.render(); } },
    render() {
        const fb = document.getElementById('btn-filter-img');
        if(this.isFiltered) { fb.innerHTML="📝 SOLO TEXTO"; fb.classList.add('active'); } else { fb.innerHTML="👁️ TODO"; fb.classList.remove('active'); }
        
        if(!this.activeQ[this.currIdx]) { if(this.activeQ.length > 0) this.currIdx = 0; else return; }
        const q = this.activeQ[this.currIdx];
        if(q.skipped) { this.goToNextAvailable(); if(this.activeQ[this.currIdx].skipped) return; this.render(); return; }

        document.getElementById('quiz-cat-name').innerText = this.currCat;
        document.getElementById('quiz-progress').innerText = `${this.currIdx+1} / ${this.activeQ.length}`;
        document.getElementById('quiz-question').innerText = q.t;
        document.getElementById('quiz-img-warn').style.display = q.img ? 'block' : 'none';
        
        const hFlag = document.getElementById('quiz-history-flag');
        hFlag.style.display = q.flagged ? 'inline' : 'none';

        const c = document.getElementById('quiz-options'); c.innerHTML = '';
        q.shuffledOpts.forEach((o, i) => {
            const d = document.createElement('div'); d.className = 'quiz-option'; d.innerText = o.t;
            if(q.status !== 'pending') {
                d.classList.add('disabled');
                if(o.c) d.classList.add('correct'); else if(q.userSel.includes(i)) d.classList.add('incorrect');
            } else if(q.userSel.includes(i)) d.classList.add('selected');
            d.onclick = () => { if(q.status!=='pending') return; const x=q.userSel.indexOf(i); if(x>-1)q.userSel.splice(x,1); else q.userSel.push(i); this.render(); };
            c.appendChild(d);
        });

        const btn = document.getElementById('btn-action'); btn.onclick = null;
        if(q.status === 'pending') {
            btn.innerText = "CONFIRMAR"; btn.className = "btn btn-primary";
            btn.onclick = () => {
                const ok = q.userSel.length && q.userSel.every(x => q.shuffledOpts[x].c) && q.userSel.length === q.shuffledOpts.filter(o=>o.c).length;
                q.status = ok ? 'correct' : 'incorrect';
                if(ok) {
                    const pending = this.activeQ.some(x => !x.skipped && x.status !== 'correct');
                    if(!pending) { this.currIdx = this.activeQ.length-1; this.save(); alert("¡FIN!"); App.goHome(); return; }
                } else q.flagged = true;
                this.save(); this.render();
            };
        } else if(q.status === 'correct') {
            btn.innerText = "SIGUIENTE"; btn.className = "btn btn-default";
            btn.onclick = () => {
                let next = -1;
                for(let i=this.currIdx+1; i<this.activeQ.length; i++) if(this.activeQ[i].status !== 'correct' && !this.activeQ[i].skipped) { next = i; break; }
                if(next !== -1) { this.currIdx = next; this.save(); this.render(); } else { alert("¡FIN!"); App.goHome(); }
            };
        } else {
            btn.innerText = "REINTENTAR"; btn.className = "btn btn-danger";
            btn.onclick = () => { q.status = 'pending'; q.userSel = []; this.save(); this.render(); };
        }

        document.getElementById('stat-ok').innerText = this.activeQ.filter(x=>x.status==='correct').length;
        document.getElementById('stat-fail').innerText = this.activeQ.filter(x=>x.status==='incorrect').length;

        const g = document.getElementById('nav-grid'); g.innerHTML = '';
        this.activeQ.forEach((x, i) => {
            const d = document.createElement('div'); d.className = 'grid-item'; d.innerText = i+1;
            if(x.skipped) d.classList.add('skipped');
            else {
                if(i === this.currIdx) d.classList.add('active');
                if(x.status === 'correct') d.classList.add('correct');
                if(x.status === 'incorrect') d.classList.add('incorrect');
                if(x.flagged) d.classList.add('was-failed');
                d.onclick = () => { this.currIdx = i; this.save(); this.render(); };
            }
            g.appendChild(d);
        });
    }
};

const Editor = {
    selCat: null, editIdx: null,
    createCategory() { const n = document.getElementById('new-cat-input').value.trim(); if(DataManager.createCat(n)) { document.getElementById('new-cat-input').value=''; this.renderCats(); } },
    renderCats() {
        const c = document.getElementById('editor-cat-list'); c.innerHTML = '';
        const t = document.getElementById('import-target'); t.innerHTML = '<option value="__AUTO__">DETECTAR AUTO</option>';
        DataManager.getCats().forEach(n => {
            const d = document.createElement('div'); d.className = 'cat-item-row'; if(this.selCat === n) d.classList.add('active');
            d.innerHTML = `<span>${n}</span> <div style="display:flex; gap:5px;"><button class="btn-icon del" onclick="event.stopPropagation();DataManager.deleteCat(\''+n+'\');Editor.renderCats()">X</button></div>`;
            d.onclick = () => this.selectCat(n); c.appendChild(d);
            const o = document.createElement('option'); o.value = n; o.innerText = n; t.appendChild(o);
        });
    },
    selectCat(n) { this.selCat = n; document.getElementById('target-cat').innerText = n; document.getElementById('search-q').value=''; this.cancelEdit(); this.renderQuestionsList(); },
    renderQuestionsList() {
        const c = document.getElementById('editor-q-list'); c.innerHTML = '';
        const s = document.getElementById('search-q').value.toLowerCase();
        if(!this.selCat) return;
        DataManager.db[this.selCat].forEach((q, i) => {
            if(s && !q.t.toLowerCase().includes(s)) return;
            const d = document.createElement('div'); d.className = 'q-row';
            d.innerHTML = `<div class="q-text-full"><b>${i+1}.</b> ${q.t}</div><div style="display:flex;gap:5px;"><button class="btn-icon" onclick="Editor.loadQ(${i})">E</button><button class="btn-icon del" onclick="if(confirm('¿Borrar?')){DataManager.deleteQ('${this.selCat}', ${i});Editor.renderQuestionsList();}">X</button></div>`;
            c.appendChild(d);
        });
    },
    switchTab(t) {
        document.getElementById('tab-manual').style.display = t==='manual'?'grid':'none';
        document.getElementById('tab-bulk').style.display = t==='bulk'?'block':'none';
        document.querySelectorAll('.tab-link').forEach(b => b.classList.remove('active'));
        if(t==='manual') document.getElementById('tab-manual-btn').classList.add('active');
        if(t==='bulk') document.getElementById('tab-bulk-btn').classList.add('active');
        if(t==='manual') this.renderCats(); else this.populateImportSelect();
    },
    updateBulkPlaceholder() {
        const v = document.getElementById('import-target').value;
        document.getElementById('bulk-input').placeholder = v==='__AUTO__' ? 'JSON Backup Completo...' : 'JSON Array Preguntas...';
    },
    populateImportSelect() { this.renderCats(); },
    
    // NEW: File Reader for .txt/.json
    readFile: function(input) {
        if(input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('bulk-input').value = e.target.result;
            };
            reader.readAsText(input.files[0]);
        }
    },

    processBulk() {
        const t = document.getElementById('import-target').value;
        const v = document.getElementById('bulk-input').value;
        if(v.trim() && DataManager.importJSON(t, v)) { alert("Importado"); document.getElementById('bulk-input').value=''; this.renderCats(); }
    },
    
    // Manual Edit Functions
    addOptionInput(v='', c=false) {
        const d=document.createElement('div'); d.style.cssText="display:flex; gap:5px; margin-bottom:5px;";
        d.innerHTML='<input type="checkbox" style="width:20px;margin:0;" '+(c?'checked':'')+'><input type="text" value="'+v.replace(/"/g,'&quot;')+'" style="flex:1;margin:0; background:#333; border:1px solid #555; color:white; padding:8px; border-radius:6px;"><button class="btn-icon del" onclick="this.parentElement.remove()">X</button>';
        document.getElementById('q-options-container').appendChild(d);
    },
    openNew() { if(!this.selCat){alert("Elige Categoría");return;} this.editIdx=null; this.resetInputs(); document.getElementById('form-container').style.display='block'; document.getElementById('btn-toggle-form').style.display='none'; },
    loadQ(i) { this.editIdx=i; const q=DataManager.db[this.selCat][i]; document.getElementById('form-container').style.display='block'; document.getElementById('btn-toggle-form').style.display='none'; document.getElementById('q-text').value=q.t; document.getElementById('q-img-check').checked=q.img; document.getElementById('q-options-container').innerHTML=''; var that=this; q.opts.forEach(function(o){that.addOptionInput(o.t,o.c)}); },
    saveQuestion: function() {
        if(!this.selCat) return;
        const t = document.getElementById('q-text').value; const opts = [];
        document.querySelectorAll('#q-options-container > div').forEach(function(d) {
            const txt = d.querySelector('input[type=text]').value.trim(); const chk = d.querySelector('input[type=checkbox]').checked;
            if(txt) opts.push({t: txt, c: chk});
        });
        if(!t || opts.length < 2) { alert("Faltan datos"); return; }
        const q = { t, opts, img: document.getElementById('q-img-check').checked };
        if(this.editIdx !== null) DataManager.updateQ(this.selCat, this.editIdx, q); else DataManager.addQ(this.selCat, q);
        this.cancelEdit(); this.renderQuestionsList();
    },
    cancelEdit: function() { this.editIdx=null; document.getElementById('form-container').style.display='none'; document.getElementById('btn-toggle-form').style.display='block'; },
    resetInputs: function() { document.getElementById('q-text').value=''; document.getElementById('q-options-container').innerHTML=''; this.addOptionInput(); this.addOptionInput(); }
};

const App = {
    init() { DataManager.init(); this.goHome(); },
    goHome() {
        this.showScreen('screen-home');
        const c = document.getElementById('home-cat-list'); c.innerHTML = '';
        const cats = DataManager.getCats();
        if(!cats.length) c.innerHTML = "<div style='grid-column:1/-1;text-align:center;color:var(--text-muted);'>Sin categorías</div>";
        cats.forEach(n => {
            const s = localStorage.getItem('SESSION_'+n);
            let cl = 'st-grey', tx = 'SIN EMPEZAR';
            if(s) { 
                try { 
                    const d=JSON.parse(s); 
                    const visibleQs = d.q.filter(function(x){return !x.skipped});
                    const allOK = visibleQs.length > 0 && visibleQs.every(q => q.status === 'correct');
                    if(allOK) { cl='st-green'; tx='ACABADO'; }
                    else if(d.q.some(x => x.status!=='pending')) { cl='st-yellow'; tx='EN PROCESO'; }
                } catch(e){} 
            }
            const div = document.createElement('div'); div.className='cat-card';
            div.innerHTML = `<div class="cat-name">${n}</div><div class="cat-status-badge ${cl}"><span class="status-dot"></span> ${tx}</div>`;
            div.onclick = () => QuizEngine.start(n); c.appendChild(div);
        });
    },
    showEditor() { 
        this.showScreen('screen-editor'); 
        Editor.switchTab('manual'); 
    },
    showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
};
App.init();
</script>
